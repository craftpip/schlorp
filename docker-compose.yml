services:
  app:
    build: .
    image: xdl-app-image:local
    container_name: xdl-app
    network: "container:gluetun-global"
    ports:
      - "7866:3000"
      - "7900:7900"
    environment:
      PORT: 3000
      API_HEADLESS: 0
      HEADLESS: 0
      AUTO_CONTINUE: 1
      ENABLE_VNC: 1
      CHROME_USER_DATA_DIR: /data/chrome
      CHROME_PROFILE_DIR: Default
    volumes:
      - .:/app
      - /app/node_modules
      - /f/downloads/studies/xdl:/app/media
      - chrome-data:/data/chrome
    restart: unless-stopped
  sync:
    image: xdl-app-image:local
    container_name: xdl-sync
    depends_on:
      - app
    command: node sync-saved-downloads.js
    environment:
      API_BASE: http://app:3000
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  chrome-data:
