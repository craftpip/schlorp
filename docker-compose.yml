services:
  app:
    build: .
    image: xdl-app-image:local
    container_name: xdl
    network_mode: "container:gluetun-nordvpn2"
    environment:
      PORT: 3000
      API_HEADLESS: 0
      HEADLESS: 0
      AUTO_CONTINUE: 1
      ENABLE_VNC: 1
      BROWSER_USER_DATA_DIR: /data/browser
      BROWSER_PROFILE_DIR: Default
      CLOAKBROWSER_CACHE_DIR: /data/cloakbrowser
    volumes:
      - .:/app
      - /app/node_modules
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - /mnt/media2t/downloads/studies/xdl:/app/media
      - browser-data:/data/browser
      - cloakbrowser-cache:/data/cloakbrowser
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  sync:
    image: xdl-app-image:local
    container_name: xdl-sync
    network_mode: "container:gluetun-nordvpn2"
    command: node sync-saved-downloads.js
    environment:
      API_BASE: http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  browser-data:
  cloakbrowser-cache:
