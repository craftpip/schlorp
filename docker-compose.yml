services:
  app:
    build: .
    image: schlorp-app-image:local
    container_name: schlorp
    ports:
      - "6768:6768"
      - "6779:6779"
      - "6780:6780"
    environment:
      PORT: 6768
      API_HEADLESS: 0
      HEADLESS: 0
      AUTO_CONTINUE: 1
      ENABLE_VNC: 1
      VNC_PORT: 6779
      NOVNC_PORT: 6780
      BROWSER_USER_DATA_DIR: /data/browser
      BROWSER_PROFILE_DIR: Default
      CLOAKBROWSER_CACHE_DIR: /data/cloakbrowser
    volumes:
      - .:/app
      - /app/node_modules
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ${MEDIA_DIR:-./media}:/app/media
      - browser-data:/data/browser
      - cloakbrowser-cache:/data/cloakbrowser
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:6768/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  browser-data:
  cloakbrowser-cache:
