services:
  app:
    build: .
    image: xdl-app-image:local
    container_name: xdl-app
    # network_mode: "container:gluetun-global"
    ports:
      - "7866:3000"
      - "7906:7900"
    environment:
      PORT: 3000
      API_HEADLESS: 0
      HEADLESS: 0
      AUTO_CONTINUE: 1
      ENABLE_VNC: 1
      CHROME_USER_DATA_DIR: /data/chrome
      CHROME_PROFILE_DIR: Default
    volumes:
      - .:/app
      - /app/node_modules
      - /mnt/media2t/downloads/studies/xdl:/app/media
      - chrome-data:/data/chrome
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  sync:
    image: xdl-app-image:local
    container_name: xdl-sync
    depends_on:
      app:
        condition: service_healthy
    command: node sync-saved-downloads.js
    environment:
      API_BASE: http://app:3000
    volumes:
      - .:/app
      - /app/node_modules
    # This job is intended to run once per container start.
    # Using `unless-stopped` causes Docker to relaunch it immediately,
    # which repeatedly rescans all saved lists in a tight loop.
    restart: "no"

volumes:
  chrome-data:
