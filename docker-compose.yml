services:
  app:
    build: .
    image: xdl-app-image:local
    container_name: xdl
    network_mode: "container:gluetun-proton1"
    environment:
      PORT: 6767
      API_HEADLESS: 0
      HEADLESS: 0
      AUTO_CONTINUE: 1
      ENABLE_VNC: 1
      VNC_PORT: 6777
      NOVNC_PORT: 6778
      BROWSER_USER_DATA_DIR: /data/browser
      BROWSER_PROFILE_DIR: Default
      CLOAKBROWSER_CACHE_DIR: /data/cloakbrowser
    volumes:
      - .:/app
      - /app/node_modules
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - /mnt/media2t/downloads/studies/xdl:/app/media
      - browser-data:/data/browser
      - cloakbrowser-cache:/data/cloakbrowser
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:6767/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  xdl-bridge:
    image: alpine/socat
    container_name: xdl-bridge
    entrypoint: sh
    command: -c "socat TCP-LISTEN:6767,fork,reuseaddr TCP:gluetun-proton1:6767 & socat TCP-LISTEN:6777,fork,reuseaddr TCP:gluetun-proton1:6777 & socat TCP-LISTEN:6778,fork,reuseaddr TCP:gluetun-proton1:6778 & wait"
    ports:
      - "6767:6767"
      - "6777:6777"
      - "6778:6778"
    networks:
      - gluetun
    restart: unless-stopped

networks:
  gluetun:
    external: true
    name: gluetun_default

volumes:
  browser-data:
  cloakbrowser-cache:
