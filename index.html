<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video Downloader</title>
    <style>
      :root {
        --bg-start: #f4efe2;
        --bg-end: #e6f1ef;
        --card: #ffffffcc;
        --text: #1f2933;
        --muted: #5a6673;
        --accent: #0f766e;
        --accent-hover: #115e59;
        --border: #d5dde5;
        --error: #b42318;
        --ok: #027a48;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--text);
        background: linear-gradient(140deg, var(--bg-start), var(--bg-end));
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(760px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        backdrop-filter: blur(8px);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.6rem;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 12px;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .queue-progress {
        margin-top: 16px;
      }

      .queue-progress__label {
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .queue-progress__bar {
        width: 100%;
        height: 12px;
        background: #e2e8f0;
        border-radius: 999px;
        overflow: hidden;
      }

      .queue-progress__bar span {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--accent), #4ade80);
        transition: width 0.25s ease;
      }

      textarea {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        font-size: 1rem;
        min-height: 120px;
        resize: vertical;
        font-family: inherit;
      }

      input[type="text"],
      select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        font-size: 0.95rem;
        background: #fff;
      }

      button {
        width: fit-content;
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        background: var(--accent);
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      button:hover {
        background: var(--accent-hover);
      }

      button.secondary {
        background: #3f4b59;
      }

      button.secondary:hover {
        background: #2f3945;
      }

      button.danger {
        background: #b42318;
      }

      button.danger:hover {
        background: #912018;
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .status {
        margin-top: 14px;
        min-height: 24px;
        font-size: 0.95rem;
      }

      .status.error {
        color: var(--error);
      }

      .status.ok {
        color: var(--ok);
      }

      .results {
        margin-top: 14px;
        display: grid;
        gap: 10px;
      }

      .result.running {
        border-color: var(--accent);
      }

      .result.done {
        border-color: #9ed8c7;
      }

      .result.error {
        border-color: #f0b8b8;
      }

      .result {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        background: #fff;
      }

      .result a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }

      .result a:hover {
        text-decoration: underline;
      }

      .label {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .src {
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.85rem;
        word-break: break-word;
      }

      .path {
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.85rem;
        word-break: break-word;
      }

      .json {
        margin-top: 8px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #f8fafb;
        color: var(--text);
        font-size: 0.8rem;
        height: 200px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .queue-url {
        font-size: 0.9rem;
        word-break: break-word;
      }

      .queue-state {
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .downloads-list {
        margin-top: 8px;
        display: grid;
        gap: 6px;
      }

      .item-actions {
        margin-top: 10px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .item-actions button {
        padding: 6px 10px;
        font-size: 0.82rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Video Downloader</h1>
      <p>Paste one URL per line, add them to the queue, then start processing.</p>

      <form id="download-form">
        <textarea
          id="urls-input"
          placeholder="https://example.com/video-page\nhttps://example.com/another-video"
          required
        ></textarea>
        <input
          id="folder-input"
          type="text"
          placeholder="Folder inside media (optional), e.g. hello or hello/sub"
        />
        <select id="max-quality-input" aria-label="Max quality (non-Instagram only)">
          <option value="">Max quality: Best available (non-Instagram)</option>
          <option value="2160">Max quality: 2160p</option>
          <option value="1440">Max quality: 1440p</option>
          <option value="1080">Max quality: 1080p</option>
          <option value="720">Max quality: 720p</option>
          <option value="540">Max quality: 540p</option>
          <option value="480">Max quality: 480p</option>
          <option value="360">Max quality: 360p</option>
          <option value="240">Max quality: 240p</option>
        </select>
        <div class="controls">
          <button id="add-to-queue-btn" type="submit">Add to queue</button>
          <button id="start-queue-btn" type="button">Start queue</button>
          <button id="stop-queue-btn" type="button" class="secondary">Stop queue</button>
          <button id="remove-downloaded-btn" class="secondary" type="button">Remove Completed</button>
          <button id="remove-all-btn" class="danger" type="button">Remove All</button>
        </div>
        <div class="queue-progress">
          <div class="queue-progress__label">Queue progress 0/0</div>
          <div class="queue-progress__bar"><span></span></div>
        </div>
      </form>

      <div id="status" class="status"></div>
      <section id="queue" class="results"></section>
      <pre id="output" class="json"></pre>
    </main>

    <script>
      const STORAGE_KEY = "xdl.queue.v1";
      const form = document.getElementById("download-form");
      const input = document.getElementById("urls-input");
      const folderInput = document.getElementById("folder-input");
      const maxQualityInput = document.getElementById("max-quality-input");
      const addToQueueBtn = document.getElementById("add-to-queue-btn");
      const startBtn = document.getElementById("start-queue-btn");
      const stopBtn = document.getElementById("stop-queue-btn");
      const removeDownloadedBtn = document.getElementById("remove-downloaded-btn");
      const removeAllBtn = document.getElementById("remove-all-btn");
      const progressLabel = document.querySelector(".queue-progress__label");
      const progressBarFill = document.querySelector(".queue-progress__bar span");
      const statusEl = document.getElementById("status");
      const queueEl = document.getElementById("queue");
      const outputEl = document.getElementById("output");
      const MAX_OUTPUT_LINES = 200;

      let isRunning = false;
      let queueStopRequested = false;
      let queueState = {
        folder: "",
        maxQuality: "",
        items: [],
      };

      function setStatus(message, kind) {
        statusEl.textContent = message || "";
        statusEl.className = `status${kind ? ` ${kind}` : ""}`;
      }

      function appendOutput(text) {
        const chunk = String(text || "");
        const incomingLines = chunk.split(/\r?\n/);
        const existingText = String(outputEl.textContent || "");
        const existingLines = existingText ? existingText.split(/\r?\n/) : [];
        const combined = existingLines.concat(incomingLines);

        if (combined.length > MAX_OUTPUT_LINES) {
          outputEl.textContent = combined.slice(combined.length - MAX_OUTPUT_LINES).join("\n");
        } else {
          outputEl.textContent = combined.join("\n");
        }
        outputEl.scrollTop = outputEl.scrollHeight;
      }

      function saveQueueState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(queueState));
        } catch {
          // ignore storage failures
        }
      }

      function loadQueueState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (!parsed || !Array.isArray(parsed.items)) return;

          queueState = {
            folder: typeof parsed.folder === "string" ? parsed.folder : "",
            maxQuality: typeof parsed.maxQuality === "string" ? parsed.maxQuality : "",
            items: parsed.items.map((item) => ({
              id: String(item.id || `${Date.now()}-${Math.random()}`),
              link: String(item.link || "").trim(),
              status: ["queued", "running", "done", "error"].includes(item.status)
                ? item.status
                : "queued",
              message: String(item.message || "Queued"),
              downloads: Array.isArray(item.downloads)
                ? item.downloads.map((x) => String(x || "").trim()).filter(Boolean)
                : [],
            })).filter((item) => item.link),
          };
        } catch {
          // ignore broken storage payload
        }
      }

      function toMediaUrl(filePath) {
        const raw = String(filePath || "").trim();
        if (!raw) return "";

        const normalized = raw.replace(/\\/g, "/");
        let relative = "";

        const marker = "/media/";
        const idx = normalized.lastIndexOf(marker);
        if (idx >= 0) {
          relative = normalized.slice(idx + marker.length);
        } else if (normalized.startsWith("media/")) {
          relative = normalized.slice("media/".length);
        } else if (normalized.startsWith("./media/")) {
          relative = normalized.slice("./media/".length);
        }

        if (!relative) return "";
        const encoded = relative
          .split("/")
          .filter(Boolean)
          .map((part) => encodeURIComponent(part))
          .join("/");

        return encoded ? `/media/${encoded}` : "";
      }

      function parseLinks(value) {
        return String(value || "")
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean);
      }

      function parseDownloadedPaths(chunkText, partialLine) {
        const text = `${partialLine || ""}${String(chunkText || "")}`;
        const parts = text.split(/\r?\n/);
        const nextPartial = parts.pop() || "";
        const found = [];

        for (const line of parts) {
          const match = line.match(/^Downloaded media to:\s+(.+)$/);
          if (match) {
            const value = String(match[1] || "").trim();
            if (value) found.push(value);
          }
        }

        return { found, nextPartial };
      }

      function hasPendingItems() {
        return queueState.items.some((item) => item.status !== "done");
      }

      function updateQueueProgress() {
        const total = queueState.items.length;
        const done = queueState.items.filter((item) => item.status === "done").length;
        const percent = total ? Math.round((done / total) * 100) : 0;

        if (progressBarFill) {
          progressBarFill.style.width = `${percent}%`;
        }

        if (progressLabel) {
          progressLabel.textContent = total
            ? `Queue progress ${done}/${total} (${percent}%)`
            : "Queue progress 0/0";
        }
      }

      function updateControls() {
        const hasPending = hasPendingItems();
        const busy = isRunning;
        if (addToQueueBtn) addToQueueBtn.disabled = busy;
        if (startBtn) startBtn.disabled = busy || !hasPending;
        if (stopBtn) stopBtn.disabled = !busy;
        removeDownloadedBtn.disabled = busy;
        removeAllBtn.disabled = busy;
      }

      function createQueueItemsFromInput() {
        const links = parseLinks(input.value);
        if (!links.length) {
          throw new Error("Please enter at least one URL (one per line).");
        }

        const now = Date.now();
        return links.map((link, index) => ({
          id: `${now}-${index}`,
          link,
          status: "queued",
          message: "Queued",
          downloads: [],
        }));
      }

      function setItemStatus(itemId, status, message) {
        const item = queueState.items.find((x) => x.id === itemId);
        if (!item) return;
        item.status = status;
        item.message = message;
        saveQueueState();
        renderQueue();
      }

      function addItemDownload(itemId, filePath) {
        const item = queueState.items.find((x) => x.id === itemId);
        if (!item) return;
        const value = String(filePath || "").trim();
        if (!value) return;
        if (!item.downloads.includes(value)) {
          item.downloads.push(value);
          saveQueueState();
          renderQueue();
        }
      }

      function removeItem(itemId) {
        if (isRunning) return;
        queueState.items = queueState.items.filter((item) => item.id !== itemId);
        saveQueueState();
        renderQueue();
      }

      function retryItem(itemId) {
        if (isRunning) return;
        const item = queueState.items.find((x) => x.id === itemId);
        if (!item) return;
        item.status = "queued";
        item.message = "Queued";
        item.downloads = [];
        saveQueueState();
        renderQueue();
      }

      function removeDownloaded() {
        if (isRunning) return;
        queueState.items = queueState.items.filter((item) => item.status !== "done");
        saveQueueState();
        renderQueue();
      }

      function removeAll() {
        if (isRunning) return;
        queueState.items = [];
        saveQueueState();
        renderQueue();
      }

      function renderQueue() {
        queueEl.innerHTML = "";
        const total = queueState.items.length;

        queueState.items.forEach((item, index) => {
          const card = document.createElement("article");
          card.className = "result";
          if (["running", "done", "error"].includes(item.status)) {
            card.classList.add(item.status);
          }

          const label = document.createElement("div");
          label.className = "label";
          label.textContent = `Item ${index + 1} of ${total}`;
          card.appendChild(label);

          const urlEl = document.createElement("div");
          urlEl.className = "queue-url";
          urlEl.textContent = item.link;
          card.appendChild(urlEl);

          const stateEl = document.createElement("div");
          stateEl.className = "queue-state";
          stateEl.textContent = item.message || "Queued";
          card.appendChild(stateEl);

          const downloadsEl = document.createElement("div");
          downloadsEl.className = "downloads-list";

          item.downloads.forEach((filePath) => {
            const row = document.createElement("div");

            const title = document.createElement("div");
            title.className = "label";
            title.textContent = "Downloaded File";
            row.appendChild(title);

            const href = toMediaUrl(filePath);
            const link = document.createElement("a");
            link.textContent = href || "File outside /media (not linkable)";
            if (href) {
              link.href = href;
              link.setAttribute("download", "");
            } else {
              link.href = "#";
              link.style.pointerEvents = "none";
            }
            row.appendChild(link);

            const path = document.createElement("div");
            path.className = "path";
            path.textContent = `Saved to: ${filePath}`;
            row.appendChild(path);

            downloadsEl.appendChild(row);
          });

          card.appendChild(downloadsEl);

          const actions = document.createElement("div");
          actions.className = "item-actions";

          const retryBtn = document.createElement("button");
          retryBtn.type = "button";
          retryBtn.className = "secondary";
          retryBtn.textContent = "Retry";
          retryBtn.disabled = isRunning;
          retryBtn.addEventListener("click", () => retryItem(item.id));
          actions.appendChild(retryBtn);

          const removeBtn = document.createElement("button");
          removeBtn.type = "button";
          removeBtn.className = "danger";
          removeBtn.textContent = "Remove";
          removeBtn.disabled = isRunning;
          removeBtn.addEventListener("click", () => removeItem(item.id));
          actions.appendChild(removeBtn);

          card.appendChild(actions);
          queueEl.appendChild(card);
        });

        updateQueueProgress();
        updateControls();
      }

      async function runQueue() {
        const queue = queueState.items;
        if (!queue.length) {
          setStatus("Queue is empty.", "error");
          return;
        }

        const pending = queue.filter((item) => item.status !== "done");
        if (!pending.length) {
          setStatus("Queue has no pending items.", "error");
          return;
        }

        const folder = String(folderInput.value || "").trim();
        const maxQuality = String(maxQualityInput.value || "").trim();
        queueState.folder = folder;
        queueState.maxQuality = maxQuality;
        saveQueueState();

        let stopped = false;
        queueStopRequested = false;
        isRunning = true;
        setStatus(`Running ${pending.length} item(s)...`);
        renderQueue();

        try {
          for (let i = 0; i < queue.length; i += 1) {
            if (queueStopRequested) {
              stopped = true;
              break;
            }

            const item = queue[i];
            if (item.status === "done") {
              continue;
            }

            setItemStatus(item.id, "running", "Running...");
            appendOutput(`\n=== Queue ${i + 1}/${queue.length}: ${item.link} ===\n`);

            try {
              const response = await fetch("/download", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ link: item.link, folder, maxQuality }),
              });

              if (!response.ok) {
                let message = "Request failed.";
                try {
                  const payload = await response.json();
                  if (payload && payload.error) message = payload.error;
                } catch {
                  // ignore
                }
                throw new Error(message);
              }

              let partialLine = "";
              const reader = response.body && response.body.getReader ? response.body.getReader() : null;
              if (!reader) {
                const text = await response.text();
                appendOutput(text);
                const parsed = parseDownloadedPaths(text, partialLine);
                partialLine = parsed.nextPartial;
                parsed.found.forEach((filePath) => addItemDownload(item.id, filePath));
              } else {
                const decoder = new TextDecoder();
                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  const text = decoder.decode(value, { stream: true });
                  appendOutput(text);
                  const parsed = parseDownloadedPaths(text, partialLine);
                  partialLine = parsed.nextPartial;
                  parsed.found.forEach((filePath) => addItemDownload(item.id, filePath));
                }
              }

              if (partialLine) {
                const parsed = parseDownloadedPaths(`${partialLine}\n`, "");
                parsed.found.forEach((filePath) => addItemDownload(item.id, filePath));
              }

              setItemStatus(item.id, "done", "Done");
            } catch (err) {
              const message = err && err.message ? err.message : "unknown error";
              setItemStatus(item.id, "error", `Failed: ${message}`);
              appendOutput(`[queue] Failed: ${item.link} -> ${message}\n`);
            }
          }
        } finally {
          isRunning = false;
          queueStopRequested = false;
          const total = queueState.items.length;
          const doneCount = queueState.items.filter((item) => item.status === "done").length;
          const failedCount = queueState.items.filter((item) => item.status === "error").length;
          renderQueue();

          if (stopped) {
            setStatus(`Queue paused. ${doneCount}/${total} completed.`);
            return;
          }

          if (failedCount > 0) {
            setStatus(`Completed ${doneCount}/${total}. Failed ${failedCount}.`, "error");
          } else {
            setStatus(`Done. Completed ${doneCount}/${total}.`, "ok");
          }
        }
      }

      function stopQueue() {
        if (!isRunning || queueStopRequested) {
          return;
        }
        queueStopRequested = true;
        if (stopBtn) stopBtn.disabled = true;
        setStatus("Stopping queue after current item...");
      }

      function handleAddToQueue(event) {
        event.preventDefault();
        try {
          const newItems = createQueueItemsFromInput();
          queueState.folder = String(folderInput.value || "").trim();
          queueState.maxQuality = String(maxQualityInput.value || "").trim();
          queueState.items = queueState.items.concat(newItems);
          saveQueueState();
          renderQueue();
          setStatus(`Queued ${newItems.length} item(s).`);
          input.value = "";
        } catch (error) {
          setStatus(error.message || "Failed to add to queue.", "error");
        }
      }

      form.addEventListener("submit", handleAddToQueue);
      startBtn.addEventListener("click", () => {
        outputEl.textContent = "";
        runQueue().catch((error) => {
          setStatus(error.message || "Queue run failed.", "error");
        });
      });
      stopBtn.addEventListener("click", stopQueue);
      removeDownloadedBtn.addEventListener("click", removeDownloaded);
      removeAllBtn.addEventListener("click", removeAll);

      loadQueueState();
      folderInput.value = queueState.folder || "";
      maxQualityInput.value = queueState.maxQuality || "";
      input.value = "";
      queueState.items.forEach((item) => {
        if (item.status === "running") {
          item.status = "queued";
          item.message = "Queued";
        }
      });
      saveQueueState();
      renderQueue();
    </script>
  </body>
</html>
