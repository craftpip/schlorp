<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video Downloader</title>
    <style>
      :root {
        --bg-start: #f4efe2;
        --bg-end: #e6f1ef;
        --card: #ffffffcc;
        --text: #1f2933;
        --muted: #5a6673;
        --accent: #0f766e;
        --accent-hover: #115e59;
        --border: #d5dde5;
        --error: #b42318;
        --ok: #027a48;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--text);
        background: linear-gradient(140deg, var(--bg-start), var(--bg-end));
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(760px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        backdrop-filter: blur(8px);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.6rem;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 12px;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 0.92rem;
        user-select: none;
      }

      .toggle input {
        accent-color: var(--accent);
      }

      textarea {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        font-size: 1rem;
        min-height: 120px;
        resize: vertical;
        font-family: inherit;
      }

      button {
        width: fit-content;
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        background: var(--accent);
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      button:hover {
        background: var(--accent-hover);
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .status {
        margin-top: 14px;
        min-height: 24px;
        font-size: 0.95rem;
      }

      .status.error {
        color: var(--error);
      }

      .status.ok {
        color: var(--ok);
      }

      .results {
        margin-top: 14px;
        display: grid;
        gap: 10px;
      }

      .result.running {
        border-color: var(--accent);
      }

      .result.done {
        border-color: #9ed8c7;
      }

      .result.error {
        border-color: #f0b8b8;
      }

      .result {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        background: #fff;
      }

      .result a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }

      .result a:hover {
        text-decoration: underline;
      }

      .label {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .src {
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.85rem;
        word-break: break-word;
      }

      .path {
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.85rem;
        word-break: break-word;
      }

      .json {
        margin-top: 8px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #f8fafb;
        color: var(--text);
        font-size: 0.8rem;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .queue-url {
        font-size: 0.9rem;
        word-break: break-word;
      }

      .queue-state {
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .downloads-list {
        margin-top: 8px;
        display: grid;
        gap: 6px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Video Downloader</h1>
      <p>Paste one URL per line, run queue, and watch live logs.</p>

      <form id="download-form">
        <textarea
          id="urls-input"
          placeholder="https://example.com/video-page\nhttps://example.com/another-video"
          required
        ></textarea>
        <div class="controls">
          <button id="submit-btn" type="submit">Run Queue</button>
        </div>
      </form>

      <div id="status" class="status"></div>
      <section id="queue" class="results"></section>
      <pre id="output" class="json"></pre>
    </main>

    <script>
      const form = document.getElementById("download-form");
      const input = document.getElementById("urls-input");
      const submitBtn = document.getElementById("submit-btn");
      const statusEl = document.getElementById("status");
      const queueEl = document.getElementById("queue");
      const outputEl = document.getElementById("output");

      function setStatus(message, kind) {
        statusEl.textContent = message || "";
        statusEl.className = `status${kind ? ` ${kind}` : ""}`;
      }

      function clearOutput() {
        outputEl.textContent = "";
      }

      function clearQueue() {
        queueEl.innerHTML = "";
      }

      function appendOutput(text) {
        outputEl.textContent += text;
        outputEl.scrollTop = outputEl.scrollHeight;
      }

      function toMediaUrl(filePath) {
        const raw = String(filePath || "").trim();
        if (!raw) return "";

        const normalized = raw.replace(/\\/g, "/");
        let relative = "";

        const marker = "/media/";
        const idx = normalized.lastIndexOf(marker);
        if (idx >= 0) {
          relative = normalized.slice(idx + marker.length);
        } else if (normalized.startsWith("media/")) {
          relative = normalized.slice("media/".length);
        } else if (normalized.startsWith("./media/")) {
          relative = normalized.slice("./media/".length);
        }

        if (!relative) return "";
        const encoded = relative
          .split("/")
          .filter(Boolean)
          .map((part) => encodeURIComponent(part))
          .join("/");

        return encoded ? `/media/${encoded}` : "";
      }

      function parseLinks(value) {
        return String(value || "")
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean);
      }

      function createQueueItem(link, index, total) {
        const card = document.createElement("article");
        card.className = "result";

        const label = document.createElement("div");
        label.className = "label";
        label.textContent = `Item ${index + 1} of ${total}`;
        card.appendChild(label);

        const urlEl = document.createElement("div");
        urlEl.className = "queue-url";
        urlEl.textContent = link;
        card.appendChild(urlEl);

        const stateEl = document.createElement("div");
        stateEl.className = "queue-state";
        stateEl.textContent = "Queued";
        card.appendChild(stateEl);

        const downloadsEl = document.createElement("div");
        downloadsEl.className = "downloads-list";
        card.appendChild(downloadsEl);

        queueEl.appendChild(card);

        return {
          link,
          card,
          stateEl,
          downloadsEl,
          seenFiles: new Set(),
          partialLine: "",
        };
      }

      function setQueueState(item, state, message) {
        item.card.classList.remove("running", "done", "error");
        if (state) item.card.classList.add(state);
        item.stateEl.textContent = message;
      }

      function addDownloadedFile(item, filePath) {
        const key = String(filePath || "").trim();
        if (!key || item.seenFiles.has(key)) return;
        item.seenFiles.add(key);

        const href = toMediaUrl(key);
        const row = document.createElement("div");

        const title = document.createElement("div");
        title.className = "label";
        title.textContent = "Downloaded File";
        row.appendChild(title);

        const link = document.createElement("a");
        link.textContent = href || "File outside /media (not linkable)";
        if (href) {
          link.href = href;
          link.setAttribute("download", "");
        } else {
          link.href = "#";
          link.style.pointerEvents = "none";
        }
        row.appendChild(link);

        const path = document.createElement("div");
        path.className = "path";
        path.textContent = `Saved to: ${key}`;
        row.appendChild(path);

        item.downloadsEl.appendChild(row);
      }

      function collectDownloadLines(item, chunkText) {
        const text = item.partialLine + String(chunkText || "");
        const parts = text.split(/\r?\n/);
        item.partialLine = parts.pop() || "";

        for (const line of parts) {
          const match = line.match(/^Downloaded media to:\s+(.+)$/);
          if (match) {
            addDownloadedFile(item, match[1]);
          }
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearOutput();
        clearQueue();

        const links = parseLinks(input.value);
        if (!links.length) {
          setStatus("Please enter at least one URL (one per line).", "error");
          return;
        }

        const queue = links.map((link, index) => createQueueItem(link, index, links.length));

        submitBtn.disabled = true;
        setStatus(`Running ${queue.length} item(s)...`);

        try {
          let completed = 0;
          let failed = 0;

          for (let i = 0; i < queue.length; i += 1) {
            const item = queue[i];
            setQueueState(item, "running", "Running...");
            appendOutput(`\n=== Queue ${i + 1}/${queue.length}: ${item.link} ===\n`);

            try {
              const response = await fetch("/download", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ link: item.link }),
              });

              if (!response.ok) {
                let message = "Request failed.";
                try {
                  const payload = await response.json();
                  if (payload && payload.error) message = payload.error;
                } catch {
                  // ignore
                }
                throw new Error(message);
              }

              const reader = response.body && response.body.getReader ? response.body.getReader() : null;
              if (!reader) {
                const text = await response.text();
                appendOutput(text);
                collectDownloadLines(item, text);
              } else {
                const decoder = new TextDecoder();
                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  const text = decoder.decode(value, { stream: true });
                  appendOutput(text);
                  collectDownloadLines(item, text);
                }
              }

              if (item.partialLine) {
                const trailing = `${item.partialLine}\n`;
                collectDownloadLines(item, trailing);
                item.partialLine = "";
              }

              setQueueState(item, "done", "Done");
              completed += 1;
            } catch (err) {
              failed += 1;
              setQueueState(item, "error", `Failed: ${err.message || "unknown error"}`);
              appendOutput(`[queue] Failed: ${item.link} -> ${err.message || "unknown error"}\n`);
            }
          }

          if (failed > 0) {
            setStatus(`Completed ${completed}/${queue.length}. Failed ${failed}.`, "error");
          } else {
            setStatus(`Done. Completed ${completed}/${queue.length}.`, "ok");
          }
        } catch (error) {
          setStatus(error.message || "Queue run failed.", "error");
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
