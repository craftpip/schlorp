<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scan Saved</title>
    <style>
      :root {
        --bg: #faf9f7;
        --surface: #ffffff;
        --surface-2: #f6f5f1;
        --border: #e5e3dc;
        --border-strong: #c9c6bb;
        --text: #22211e;
        --muted: #6f6c63;
        --accent: #1d4ed8;
        --accent-dark: #1e40af;
        --accent-soft: #eaf0fb;
        --danger: #b3261e;
        --radius: 6px;
        --serif: Georgia, "Times New Roman", "Palatino Linotype", serif;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 48px 24px;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.55;
      }

      .card {
        width: min(720px, 100%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px;
      }

      h1 {
        margin: 0 0 6px;
        font-family: var(--serif);
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      p { margin: 0 0 20px; color: var(--muted); }

      form { display: grid; gap: 12px; }

      label { font-size: 0.82rem; font-weight: 600; color: var(--muted); }

      input,
      textarea {
        width: 100%;
        border-radius: var(--radius);
        border: 1px solid var(--border-strong);
        background: var(--surface);
        padding: 9px 12px;
        font-size: 0.95rem;
        font-family: inherit;
        color: var(--text);
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      textarea {
        min-height: 90px;
        resize: vertical;
      }

      button {
        width: fit-content;
        border: 1px solid var(--accent);
        border-radius: var(--radius);
        padding: 8px 16px;
        background: var(--accent);
        color: #fff;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-dark);
        border-color: var(--accent-dark);
      }

      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }

      .status {
        margin-top: 12px;
        min-height: 24px;
        font-size: 13px;
        color: var(--muted);
      }

      .status.error {
        color: var(--danger);
      }

      .results {
        margin-top: 16px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 14px;
      }

      .panel h2 {
        margin: 0 0 8px;
        font-family: var(--serif);
        font-size: 15px;
        font-weight: 700;
      }

      .list {
        max-height: 280px;
        overflow: auto;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .list li {
        border-bottom: 1px solid var(--border);
        padding: 6px 0;
        word-break: break-word;
        font-size: 0.9rem;
      }

      .list li:last-child {
        border-bottom: 0;
      }

      .meta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 0.85rem;
        font-family: var(--mono);
      }

      pre {
        margin: 0;
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface-2);
        padding: 10px;
        font-size: 0.8rem;
        font-family: var(--mono);
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Scan Saved</h1>
      <p>Opens an independent browser tab, scrolls, and returns URLs + extracted IDs.</p>

      <form id="scan-form">
        <label for="url-input">URL to scan</label>
        <input
          id="url-input"
          type="url"
          required
          placeholder="https://www.instagram.com/username/saved/list/list-id/"
        />

        <label for="end-urls-input">End URLs (optional, one per line)</label>
        <textarea id="end-urls-input" placeholder="https://www.instagram.com/p/XXXX/\nhttps://www.instagram.com/reel/YYYY/"></textarea>

        <button id="run-btn" type="submit">Scan Saved Page</button>
      </form>

      <div id="status" class="status"></div>
      <div id="meta" class="meta"></div>

      <section class="results">
        <article class="panel">
          <h2>Found IDs</h2>
          <ul id="ids-list" class="list"></ul>
        </article>
        <article class="panel">
          <h2>Found URLs</h2>
          <ul id="urls-list" class="list"></ul>
        </article>
        <article class="panel">
          <h2>Raw Result</h2>
          <pre id="raw-output"></pre>
        </article>
      </section>
    </main>

    <script>
      const form = document.getElementById("scan-form");
      const urlInput = document.getElementById("url-input");
      const endUrlsInput = document.getElementById("end-urls-input");
      const runBtn = document.getElementById("run-btn");
      const statusEl = document.getElementById("status");
      const metaEl = document.getElementById("meta");
      const idsListEl = document.getElementById("ids-list");
      const urlsListEl = document.getElementById("urls-list");
      const rawOutputEl = document.getElementById("raw-output");

      function setStatus(text, kind) {
        statusEl.textContent = text || "";
        statusEl.className = `status${kind ? ` ${kind}` : ""}`;
      }

      function parseEndUrls(raw) {
        return String(raw || "")
          .split(/\r?\n/)
          .map((value) => value.trim())
          .filter(Boolean);
      }

      function renderList(container, values) {
        container.innerHTML = "";
        values.forEach((value) => {
          const item = document.createElement("li");
          item.textContent = value;
          container.appendChild(item);
        });
      }

      function setMeta(result) {
        const parts = [
          `Reason: ${result.reason || "unknown"}`,
          `Iterations: ${result.iterations || 0}`,
          `URLs: ${result.totalUrls || 0}`,
          `IDs: ${result.totalIds || 0}`,
        ];
        metaEl.textContent = parts.join(" | ");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const targetUrl = String(urlInput.value || "").trim();
        const endUrls = parseEndUrls(endUrlsInput.value);

        setStatus("Starting scan in a new browser tab...");
        metaEl.textContent = "";
        idsListEl.innerHTML = "";
        urlsListEl.innerHTML = "";
        rawOutputEl.textContent = "";
        runBtn.disabled = true;

        try {
          const response = await fetch("/scan-saved", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: targetUrl, endUrls }),
          });

          const payload = await response.json().catch(() => ({}));
          if (!response.ok || !payload.ok) {
            throw new Error(payload.error || "Scan failed.");
          }

          renderList(idsListEl, Array.isArray(payload.ids) ? payload.ids : []);
          renderList(urlsListEl, Array.isArray(payload.urls) ? payload.urls : []);
          setMeta(payload);
          rawOutputEl.textContent = JSON.stringify(payload, null, 2);
          setStatus(`Scan complete. Found ${payload.totalIds || 0} id(s).`);
        } catch (error) {
          setStatus(error && error.message ? error.message : "Scan failed.", "error");
        } finally {
          runBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
