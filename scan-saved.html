<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scan Saved</title>
    <style>
      :root {
        --bg-a: #f5f0ea;
        --bg-b: #e4f0eb;
        --card: #ffffffd9;
        --text: #1f2933;
        --muted: #55606e;
        --accent: #166534;
        --accent-hover: #14532d;
        --border: #d2dce5;
        --error: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 10% 10%, #fdf4e8 0, transparent 30%),
          radial-gradient(circle at 90% 20%, #dbf4e4 0, transparent 35%),
          linear-gradient(150deg, var(--bg-a), var(--bg-b));
        color: var(--text);
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }

      .card {
        width: min(860px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        backdrop-filter: blur(8px);
      }

      h1 {
        margin: 0 0 6px;
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 12px;
      }

      label {
        font-size: 0.85rem;
        color: var(--muted);
      }

      input,
      textarea {
        width: 100%;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #fff;
        padding: 10px 12px;
        font-size: 0.95rem;
        font-family: inherit;
      }

      textarea {
        min-height: 90px;
        resize: vertical;
      }

      button {
        width: fit-content;
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-hover);
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .status {
        margin-top: 12px;
        min-height: 24px;
      }

      .status.error {
        color: var(--error);
      }

      .results {
        margin-top: 12px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        padding: 12px;
      }

      .panel h2 {
        margin: 0 0 8px;
        font-size: 0.95rem;
      }

      .list {
        max-height: 280px;
        overflow: auto;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .list li {
        border-bottom: 1px solid #edf2f7;
        padding: 6px 0;
        word-break: break-word;
        font-size: 0.9rem;
      }

      .meta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 0.9rem;
      }

      pre {
        margin: 0;
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #f7fafc;
        padding: 10px;
        font-size: 0.8rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Scan Saved</h1>
      <p>Opens an independent browser tab, scrolls, and returns URLs + extracted IDs.</p>

      <form id="scan-form">
        <label for="url-input">URL to scan</label>
        <input
          id="url-input"
          type="url"
          required
          value="https://www.instagram.com/whatwhatwhaaaaaaaat/saved/cosplay/18108968914608682/"
        />

        <label for="end-urls-input">End URLs (optional, one per line)</label>
        <textarea id="end-urls-input" placeholder="https://www.instagram.com/p/XXXX/\nhttps://www.instagram.com/reel/YYYY/"></textarea>

        <button id="run-btn" type="submit">Scan Saved Page</button>
      </form>

      <div id="status" class="status"></div>
      <div id="meta" class="meta"></div>

      <section class="results">
        <article class="panel">
          <h2>Found IDs</h2>
          <ul id="ids-list" class="list"></ul>
        </article>
        <article class="panel">
          <h2>Found URLs</h2>
          <ul id="urls-list" class="list"></ul>
        </article>
        <article class="panel">
          <h2>Raw Result</h2>
          <pre id="raw-output"></pre>
        </article>
      </section>
    </main>

    <script>
      const form = document.getElementById("scan-form");
      const urlInput = document.getElementById("url-input");
      const endUrlsInput = document.getElementById("end-urls-input");
      const runBtn = document.getElementById("run-btn");
      const statusEl = document.getElementById("status");
      const metaEl = document.getElementById("meta");
      const idsListEl = document.getElementById("ids-list");
      const urlsListEl = document.getElementById("urls-list");
      const rawOutputEl = document.getElementById("raw-output");

      function setStatus(text, kind) {
        statusEl.textContent = text || "";
        statusEl.className = `status${kind ? ` ${kind}` : ""}`;
      }

      function parseEndUrls(raw) {
        return String(raw || "")
          .split(/\r?\n/)
          .map((value) => value.trim())
          .filter(Boolean);
      }

      function renderList(container, values) {
        container.innerHTML = "";
        values.forEach((value) => {
          const item = document.createElement("li");
          item.textContent = value;
          container.appendChild(item);
        });
      }

      function setMeta(result) {
        const parts = [
          `Reason: ${result.reason || "unknown"}`,
          `Iterations: ${result.iterations || 0}`,
          `URLs: ${result.totalUrls || 0}`,
          `IDs: ${result.totalIds || 0}`,
        ];
        metaEl.textContent = parts.join(" | ");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const targetUrl = String(urlInput.value || "").trim();
        const endUrls = parseEndUrls(endUrlsInput.value);

        setStatus("Starting scan in a new browser tab...");
        metaEl.textContent = "";
        idsListEl.innerHTML = "";
        urlsListEl.innerHTML = "";
        rawOutputEl.textContent = "";
        runBtn.disabled = true;

        try {
          const response = await fetch("/scan-saved", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: targetUrl, endUrls }),
          });

          const payload = await response.json().catch(() => ({}));
          if (!response.ok || !payload.ok) {
            throw new Error(payload.error || "Scan failed.");
          }

          renderList(idsListEl, Array.isArray(payload.ids) ? payload.ids : []);
          renderList(urlsListEl, Array.isArray(payload.urls) ? payload.urls : []);
          setMeta(payload);
          rawOutputEl.textContent = JSON.stringify(payload, null, 2);
          setStatus(`Scan complete. Found ${payload.totalIds || 0} id(s).`);
        } catch (error) {
          setStatus(error && error.message ? error.message : "Scan failed.", "error");
        } finally {
          runBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
